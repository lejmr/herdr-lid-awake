name: release
on:
  push:
    tags: ['v*']
  # Rebuild the tap formula and bottle of an existing release, e.g. after a failed run.
  workflow_dispatch:
    inputs:
      tag:
        description: 'existing release tag, e.g. v0.2.1'
        required: true
permissions:
  contents: write
jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION and CHANGELOG
        run: |
          version=$(sed -n 's/^VERSION=//p' herdr-lid-awake)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME != v$version in herdr-lid-awake"; exit 1; }
          grep -q "^## $version " CHANGELOG.md || { echo "CHANGELOG.md has no '## $version' section"; exit 1; }
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v h="## $version " 'index($0, h) == 1 { p = 1; next } /^## / { p = 0 } p' CHANGELOG.md > notes.md
          # A rerun after a later step failed must not stop here.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

  # One commit to the tap with the new url, sha256 and bottle. Without a bottle, brew treats
  # the formula as a build from source and refuses to install with an outdated Xcode.
  tap:
    needs: release
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lejmr/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
      - name: Checksum of the tag tarball
        run: |
          url="https://github.com/${{ github.repository }}/archive/refs/tags/$TAG.tar.gz"
          echo "URL=$url" >> "$GITHUB_ENV"
          # A file, not a pipe: a failed curl in $(...) would hash nothing and publish e3b0c442....
          # Right after a tag is pushed (or re-pushed) the archive can 404 for a few minutes.
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 30 -o tag.tar.gz "$url"
          echo "SHA=$(shasum -a 256 tag.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Bump the formula
        working-directory: tap
        run: |
          f=Formula/herdr-lid-awake.rb
          sed -i '' -E "s|^(  url \").*(\")|\1$URL\2|; s|^(  sha256 \").*(\")|\1$SHA\2|" "$f"
          # The old bottle is for the old version; brew bottle --write adds the new one.
          perl -0pi -e 's/\n  bottle do\n.*?\n  end\n//s' "$f"
          grep -q "refs/tags/$TAG.tar.gz" "$f" || { echo "url not bumped"; exit 1; }
      - name: Build the bottle
        run: |
          set -o pipefail
          # Symlinked, not `brew tap <path>`: that clones and would miss the uncommitted bump.
          taps="$(brew --repository)/Library/Taps/lejmr"
          mkdir -p "$taps" && ln -s "$PWD/tap" "$taps/homebrew-tap"
          brew install --build-bottle lejmr/tap/herdr-lid-awake
          brew bottle --json --no-rebuild \
            --root-url "https://github.com/${{ github.repository }}/releases/download/$TAG" \
            lejmr/tap/herdr-lid-awake
          # A shell script is the same on every Mac: publish it as the `all` bottle, not as
          # this runner's tag only (Intel and other macOS versions would build from source).
          json=$(ls herdr-lid-awake--*.bottle.json)
          t=$(jq -r '.[].bottle.tags | keys[0]' "$json")
          jq --arg t "$t" '.[].bottle.tags |= {all: (.[$t]
              | .filename |= sub("\\.\($t)\\."; ".all.")
              | .local_filename |= sub("\\.\($t)\\."; ".all."))}' "$json" > all.json
          old=$(jq -r --arg t "$t" '.[].bottle.tags[$t].local_filename' "$json")
          # brew bottle writes herdr-lid-awake--X.tar.gz; brew downloads herdr-lid-awake-X.tar.gz.
          name=$(jq -r '.[].bottle.tags.all.filename' all.json)
          mv "$old" "$name"
          gh release upload "$TAG" "$name" --clobber --repo "${{ github.repository }}"
          brew bottle --merge --write --no-commit all.json
          grep -q 'all: ' tap/Formula/herdr-lid-awake.rb || { echo "no all bottle in the formula"; exit 1; }
      - name: Commit to the tap
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet && { echo "tap already has $TAG"; exit 0; }
          git commit -am "herdr-lid-awake ${TAG#v}"
          git push
